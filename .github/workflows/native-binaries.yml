name: Native binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - "native/pi-undo-fs/**"
      - "src/durable-pack.ts"
      - "src/native-restore.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-binaries.yml"
  pull_request:
    paths:
      - "native/pi-undo-fs/**"
      - "src/durable-pack.ts"
      - "src/native-restore.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-binaries.yml"

permissions:
  contents: read
  id-token: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            output: pi-undo-fs-darwin-arm64
          - target: x86_64-apple-darwin
            output: pi-undo-fs-darwin-x64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build helper
        run: cargo build --release --locked --manifest-path native/pi-undo-fs/Cargo.toml --target "${{ matrix.target }}"
      - name: Stage binary
        run: |
          mkdir -p native-artifact
          cp "native/pi-undo-fs/target/${{ matrix.target }}/release/pi-undo-fs" "native-artifact/${{ matrix.output }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: native-artifact/${{ matrix.output }}

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            output: pi-undo-fs-linux-x64
            linker: gcc
          - target: aarch64-unknown-linux-gnu
            output: pi-undo-fs-linux-arm64
            linker: aarch64-linux-gnu-gcc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build helper
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --manifest-path native/pi-undo-fs/Cargo.toml --target "${{ matrix.target }}"
      - name: Stage binary
        run: |
          mkdir -p native-artifact
          cp "native/pi-undo-fs/target/${{ matrix.target }}/release/pi-undo-fs" "native-artifact/${{ matrix.output }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: native-artifact/${{ matrix.output }}

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            output: pi-undo-fs-win32-x64.exe
          - target: aarch64-pc-windows-msvc
            output: pi-undo-fs-win32-arm64.exe
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build helper
        run: cargo build --release --locked --manifest-path native/pi-undo-fs/Cargo.toml --target "${{ matrix.target }}"
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p native-artifact
          cp "native/pi-undo-fs/target/${{ matrix.target }}/release/pi-undo-fs.exe" "native-artifact/${{ matrix.output }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: native-artifact/${{ matrix.output }}

  package:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: pi-undo-fs-*
          path: native/bin
          merge-multiple: true
      - name: Verify native binary matrix
        run: |
          expected=(
            pi-undo-fs-darwin-arm64
            pi-undo-fs-darwin-x64
            pi-undo-fs-linux-arm64
            pi-undo-fs-linux-x64
            pi-undo-fs-win32-arm64.exe
            pi-undo-fs-win32-x64.exe
          )
          for binary in "${expected[@]}"; do
            test -f "native/bin/$binary" || { echo "Missing native binary: $binary"; exit 1; }
          done
          test "$(find native/bin -maxdepth 1 -type f -name 'pi-undo-fs-*' | wc -l)" -eq "${#expected[@]}"
      - run: chmod +x native/bin/pi-undo-fs-*
      - run: npm ci
      - run: npm test
      - name: Typecheck project sources
        run: |
          output="$(npx tsc --noEmit 2>&1 || true)"
          filtered="$(printf '%s\n' "$output" | grep -vE 'undici-types|@modelcontextprotocol|ReadonlySessionManager|@google/genai' || true)"
          test -z "$filtered" || { printf '%s\n' "$filtered"; exit 1; }
      - name: Pack npm package
        run: npm pack
      - name: Publish npm package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_tag="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$package_tag" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $package_tag"
            exit 1
          }
          npm publish ./*.tgz --access public --provenance
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: "*.tgz"
